; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@6.4.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Was referenced as ${env.build_flags} below without being defined here, which is a
; no-op today but fragile - defined explicitly so the interpolation always resolves.
build_flags =

[esp32dev_base]
board = esp32dev
build_flags =
	${env.build_flags}
	-mfix-esp32-psram-cache-issue
	-DBOARD_HAS_PSRAM
monitor_filters =
	default
	esp32_exception_decoder

[env:T-SIM7600X]
extends = esp32dev_base
board_build.partitions = huge_app.csv
; The board is an ESP32-WROVER-E-N16R8 (16MB flash / 8MB PSRAM) - this was set to 4MB,
; wasting 12MB and mis-telling the bootloader the flash size.
board_build.flash_size = 16MB
build_flags = ${esp32dev_base.build_flags}
	-DT_SIM7600X
	-DMBEDTLS_KEY_EXCHANGE__SOME__PSK_ENABLED
    -DMBEDTLS_KEY_EXCHANGE_PSK_ENABLED
	-DCONFIG_BT_ENABLED
	-DCONFIG_BLUEDROID_ENABLED
	-Os
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
lib_deps =
	bblanchon/ArduinoJson@^7.3.0
; Removed: TinyGSM, StreamDebugger, ArduinoHttpClient, PubSubClient, and both SSLClient
; entries - all of it supported the LTE/MQTT stack, which has been fully removed (the
; device is BLE-only; see mqtt_lte_client.cpp's removal). Also removed both
; LiquidCrystal_I2C entries (two different libraries for the same device, both 100%
; unused - the display is driven directly by ch453s_driver.cpp, not an LCD library).
